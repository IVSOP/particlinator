cargo-features = ["profile-rustflags"]

[package]
name = "particlinator"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
bevy_math = "0.16.1"
bytemuck = "1.23.0"
env_logger = "0.11.8"
image = "0.25.6"
log = "0.4.27"
pollster = "0.4.0"
serde = "1.0.219"
wgpu = "25.0.2"
winit = "0.30.11"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Enable more optimization in the release profile at the cost of compile time.
[profile.release]
# lto = "fat"
# strip = "debuginfo"
lto = true
opt-level = 3
codegen-units = 1
incremental = false
debug = false
strip = true # use "debuginfo"?
rustflags = ["--remap-path-prefix=/home/ivsopi3=/"]
